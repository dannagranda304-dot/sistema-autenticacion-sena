<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso de usuarios | Proyecto SENA</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="brand">PROYECTO SENA · ADSO</div>
    <h1>Bienvenido</h1>
    <p class="intro">Sistema de registro y autenticación de usuarios</p>
    <div class="tabs" role="tablist" aria-label="Seleccionar formulario">
      <button id="loginTab" class="tab active" type="button" aria-selected="true">Iniciar sesión</button>
      <button id="registerTab" class="tab" type="button" aria-selected="false">Registrarse</button>
    </div>
    <form id="authForm">
      <label for="username">Nombre de usuario</label>
      <input id="username" name="username" autocomplete="username" placeholder="Escribe tu usuario" minlength="3" maxlength="30" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Escribe tu contraseña" minlength="8" required>
      <button class="submit" id="submitButton" type="submit">Ingresar</button>
    </form>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    <p class="footer">Evidencia GA7-220501096-AA5-EV01</p>
  </main>
</body>
</html>
